<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DonorFinder++ | RMK College Hackathon Edition</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <div class="glow-bg"></div>

    <div class="app-container">
        <header class="glass-header">
            <div class="brand"><i class="ri-heart-pulse-fill"></i> DonorFinder<span>++</span></div>
            <div class="status-pill"><span class="pulse"></span> RMK Hackathon Live Node</div>
        </header>

        {% if request.args.get('registered') %}
            <div class="alert"><i class="ri-checkbox-circle-line"></i> Success! You are now registered on the live emergency donor matrix.</div>
        {% endif %}

        <div class="view-switch">
            <button onclick="switchView('search')" id="btn-search" class="active"><i class="ri-search-2-line"></i> Emergency Search</button>
            <button onclick="switchView('register')" id="btn-register"><i class="ri-user-add-line"></i> Donor Onboarding</button>
        </div>

        <!-- VIEW 1: SEARCH + MAP -->
        <section id="search-view">
            <div class="glass-panel">
                <div class="search-grid">
                    <select id="blood-q" onchange="triggerSearch()">
                        <option value="O+">O Positive (O+)</option>
                        <option value="O-">O Negative (O-)</option>
                        <option value="A+">A Positive (A+)</option>
                        <option value="A-">A Negative (A-)</option>
                        <option value="B+">B Positive (B+)</option>
                        <option value="B-">B Negative (B-)</option>
                        <option value="AB+">AB Positive (AB+)</option>
                        <option value="AB-">AB Negative (AB-)</option>
                    </select>
                    <input type="text" id="loc-q" placeholder="Filter by City or Area..." onkeyup="triggerSearch()">
                    <button onclick="triggerSearch()" class="btn-hero"><i class="ri-radar-line"></i> Scan Network</button>
                </div>
            </div>

            <div id="map"></div>
            <div id="donor-results" class="donor-grid"></div>
        </section>

        <!-- VIEW 2: REGISTRATION -->
        <section id="register-view" class="hidden">
            <div class="glass-panel">
                <h2 style="margin-bottom: 20px; font-size: 1.4rem; color: var(--secondary);"><i class="ri-shield-user-line"></i> Register as Life-Saver</h2>
                <form action="/register" method="POST">
                    <div class="form-row">
                        <div>
                            <label>Full Name</label>
                            <input type="text" name="name" placeholder="E.g. Rahul Sharma" required>
                        </div>
                        <div>
                            <label>Blood Group</label>
                            <select name="blood">
                                <option value="O+">O+</option><option value="O-">O-</option>
                                <option value="A+">A+</option><option value="A-">A-</option>
                                <option value="B+">B+</option><option value="B-">B-</option>
                                <option value="AB+">AB+</option><option value="AB-">AB-</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div>
                            <label>City / Campus Location</label>
                            <input type="text" name="location" placeholder="E.g. Chennai / Kavaraipettai" required>
                        </div>
                        <div>
                            <label>Last Donation Status</label>
                            <input type="text" name="last_donation" placeholder="E.g. Ready / 2 months ago">
                        </div>
                    </div>

                    <label>WhatsApp Contact Number (with country code)</label>
                    <input type="tel" name="phone" placeholder="E.g. 919876543210" required>

                    <button type="submit" class="btn-hero" style="width: 100%; margin-top: 20px;"><i class="ri-send-plane-fill"></i> Save to Secure Ledger</button>
                </form>
            </div>
        </section>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = L.map('map').setView([13.1143, 80.1113], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);

        function switchView(view) {
            document.getElementById('search-view').className = view === 'search' ? '' : 'hidden';
            document.getElementById('register-view').className = view === 'register' ? '' : 'hidden';
            document.getElementById('btn-search').classList.toggle('active', view === 'search');
            document.getElementById('btn-register').classList.toggle('active', view === 'register');
            if(view === 'search') { setTimeout(() => map.invalidateSize(), 200); }
        }

        async function triggerSearch() {
            const b = document.getElementById('blood-q').value;
            const l = document.getElementById('loc-q').value;
            const grid = document.getElementById('donor-results');
            
            grid.innerHTML = '<div class="loader"><i class="ri-loader-4-line ri-spin"></i> Querying decentralized donor nodes...</div>';

            const res = await fetch(`/api/search?blood=${encodeURIComponent(b)}&location=${encodeURIComponent(l)}`);
            const donors = await res.json();

            markersLayer.clearLayers();

            if (!donors.length) {
                grid.innerHTML = '<p class="empty-msg">No active donors found matching your specifications.</p>';
                return;
            }

            grid.innerHTML = '';
            donors.forEach(d => {
                grid.innerHTML += `
                    <div class="donor-card">
                        <div class="blood-ring">${d.blood_group}</div>
                        <div class="meta">
                            <h3>${d.name}</h3>
                            <p><i class="ri-map-pin-2-fill"></i> ${d.location}</p>
                            <small>Status: ${d.last_donation}</small>
                        </div>
                        <a href="https://wa.me/${d.phone}?text=Emergency!%20Blood%20group%20${d.blood_group}%20needed%20urgently." class="wa-btn" target="_blank" title="Instant WhatsApp">
                            <i class="ri-whatsapp-line"></i>
                        </a>
                    </div>
                `;

                if(d.lat && d.lng) {
                    let marker = L.marker([d.lat, d.lng]).bindPopup(`<b>${d.name}</b><br>Blood: <b>${d.blood_group}</b><br>City: ${d.location}`);
                    markersLayer.addLayer(marker);
                }
            });
        }

        window.onload = triggerSearch;
    </script>
</body>
</html>
