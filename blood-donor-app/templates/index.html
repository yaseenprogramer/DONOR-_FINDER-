<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DonorFinder++ | Emergency Blood Network</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="logo">
            <i class="ri-heart-pulse-fill"></i>
            <span>DonorFinder<span>++</span></span>
        </div>
        <nav>
            <button id="btn-search" class="active" onclick="switchView('search')"><i class="ri-search-line"></i> Find Donors</button>
            <button id="btn-register" onclick="switchView('register')"><i class="ri-user-add-line"></i> Register as Donor</button>
        </nav>
    </header>

    <main>
        <!-- SEARCH VIEW -->
        <section id="search-view" class="view">
            <div class="search-panel">
                <h2>Find Emergency Blood Donors</h2>
                <div class="filter-group">
                    <select id="blood-q">
                        <option value="All">All Blood Groups</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                    <input type="text" id="loc-q" placeholder="Enter city or area...">
                    <button onclick="triggerSearch()"><i class="ri-search-2-line"></i> Search</button>
                </div>
                <div id="donor-results" class="results-grid"></div>
            </div>
            <div id="map"></div>
        </section>

        <!-- REGISTER VIEW -->
        <section id="register-view" class="view hidden">
            <div class="form-card">
                <h2>Join the Donor Network</h2>
                <form id="reg-form" onsubmit="submitDonor(event)">
                    <input type="text" id="reg-name" placeholder="Full Name" required>
                    <select id="reg-blood" required>
                        <option value="" disabled selected>Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                    <input type="text" id="reg-location" placeholder="City / Area Location" required>
                    <input type="tel" id="reg-phone" placeholder="Phone Number" required>
                    <input type="text" id="reg-lat" placeholder="Latitude (e.g., 13.1143)" value="13.1143">
                    <input type="text" id="reg-lng" placeholder="Longitude (e.g., 80.1113)" value="80.1113">
                    <button type="submit" class="btn-primary">Register Now</button>
                </form>
            </div>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = L.map('map').setView([13.1143, 80.1113], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);

        function switchView(view) {
            document.getElementById('search-view').className = view === 'search' ? 'view' : 'view hidden';
            document.getElementById('register-view').className = view === 'register' ? 'view' : 'view hidden';
            document.getElementById('btn-search').classList.toggle('active', view === 'search');
            document.getElementById('btn-register').classList.toggle('active', view === 'register');
            if(view === 'search') { setTimeout(() => map.invalidateSize(), 200); }
        }

        async function triggerSearch() {
            const b = document.getElementById('blood-q').value;
            const l = document.getElementById('loc-q').value;
            const grid = document.getElementById('donor-results');
            
            grid.innerHTML = '<div class="loader"><i class="ri-loader-4-line ri-spin"></i> Searching donors...</div>';

            const res = await fetch(`/api/search?blood=${encodeURIComponent(b)}&location=${encodeURIComponent(l)}`);
            const donors = await res.json();

            markersLayer.clearLayers();
            grid.innerHTML = '';

            if (!donors.length) {
                grid.innerHTML = '<p class="no-data">No donors found matching criteria.</p>';
                return;
            }

            donors.forEach(d => {
                const card = document.createElement('div');
                card.className = 'donor-card';
                card.innerHTML = `
                    <div class="badge">${d.blood}</div>
                    <div class="meta">
                        <h3>${d.name}</h3>
                        <p><i class="ri-map-pin-2-fill"></i> ${d.location}</p>
                        <small>Status: ${d.last_donation}</small>
                    </div>
                    <a href="https://wa.me/${d.phone}?text=Emergency!%20Blood%20Group%20${d.blood}%20needed." target="_blank" class="wa-btn">
                        <i class="ri-whatsapp-line"></i>
                    </a>
                `;
                grid.appendChild(card);

                if (d.lat && d.lng) {
                    let marker = L.marker([d.lat, d.lng]).bindPopup(`<b>${d.name}</b><br>${d.blood} - ${d.location}`);
                    markersLayer.addLayer(marker);
                }
            });
        }

        async function submitDonor(e) {
            e.preventDefault();
            const data = {
                name: document.getElementById('reg-name').value,
                blood: document.getElementById('reg-blood').value,
                location: document.getElementById('reg-location').value,
                phone: document.getElementById('reg-phone').value,
                lat: parseFloat(document.getElementById('reg-lat').value) || 13.1143,
                lng: parseFloat(document.getElementById('reg-lng').value) || 80.1113
            };

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert('Successfully registered as a donor!');
                document.getElementById('reg-form').reset();
                switchView('search');
                triggerSearch();
            } else {
                alert('Registration failed. Please check inputs.');
            }
        }

        window.onload = triggerSearch;
    </script>
</body>
</html>
